name: Github Pages

on:
  push:
      branches:
        - source

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.ks
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Build site
        run: |
          npm install
          npm run-script build

      - name: Upload site
        id: deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: public/

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
